<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 벽돌깨기</title>
    <link rel="stylesheet" href="brick_game.css">
  </head>
  <body>
    <main class="game-wrapper">
      <h1>자바스크립트 벽돌깨기</h1>

      <section class="game-panel" aria-label="벽돌깨기 게임">
        <div class="game-info" aria-live="polite">
          <span>
            점수: <strong id="score">0</strong>
            (남은 벽돌: <strong id="remainingBricks">63</strong>개)
          </span>
          <span>남은 기회: <strong id="remainingChances">3</strong>회</span>
           <span>상태: <strong id="status">대기</strong></span>
        </div>

        <canvas
          id="gameCanvas"
          width="960"
          height="630"
          aria-label="방향키로 컨트롤 바를 움직이고 스페이스키로 시작하는 벽돌깨기 게임"
        ></canvas>

        <p id="message" class="game-message">스페이스키를 눌러 게임을 시작하세요.</p>
      </section>
    </main>

    <script src="brick_game.js"></script>
  </body>
</html>
